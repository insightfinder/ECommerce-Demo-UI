# Demo Store site. This file is a template: ${APISERVER_ADDR} and
# ${MONITORING_CIDR} are filled in with envsubst (by the nginx image's
# /etc/nginx/templates mechanism in Docker, by deploy/install.sh on EC2).
# All other $variables are nginx's own and are left alone.

upstream apiserver {
    server ${APISERVER_ADDR};
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # ---------- API ----------

    location /api/ {
        proxy_pass http://apiserver;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # No retries: one client request = one apiserver request, so failures
        # stay visible instead of being masked or doubled (e.g. POST /api/orders).
        proxy_next_upstream off;

        # The apiserver echoes the id we sent; replace it so nginx-generated
        # errors carry the same header.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
        add_header Cache-Control "no-store" always;

        # Applies only to errors nginx generates itself (proxy_intercept_errors
        # is off), so the apiserver's own 503 bodies (db_lock_timeout, ...) pass
        # through untouched.
        error_page 502 @api_502;
        error_page 503 @api_503;
        error_page 504 @api_504;
    }

    location @api_502 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"upstream_unavailable","message":"the API server could not be reached","request_id":"$req_id"}';
    }

    location @api_503 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"service_unavailable","message":"the API server is unavailable","request_id":"$req_id"}';
    }

    location @api_504 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":"upstream_timeout","message":"the API server did not respond in time","request_id":"$req_id"}';
    }

    # ---------- nginx metrics for nginx-prometheus-exporter ----------

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow ${MONITORING_CIDR};
        deny all;
    }

    # ---------- static SPA ----------

    # Vite's hashed bundles: the file name changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
