# Main nginx config for the Demo Store UI tier. Site config is in conf.d/store.conf.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One JSON object per line. upstream_* values are strings because nginx
    # writes "-" when there was no upstream and comma-separated lists when more
    # than one was tried.
    log_format json_access escape=json '{'
        '"time_iso8601":"$time_iso8601",'
        '"request_id":"$req_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.json json_access;

    # Use the client's X-Request-ID when it is in the format the apiserver
    # accepts, otherwise nginx's own $request_id, so the browser console, this
    # log and the apiserver log all show the same id.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
        default                     $request_id;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
